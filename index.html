<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TurtleClient Launcher</title>
<script src="/boot.js"></script>
<link rel="icon" href="/turtleclient-icon.svg">
<meta name="color-scheme" content="dark">
<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
#boot{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;display:grid;place-items:center;background:#161718;transition:opacity .34s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot img{width:min(420px,70vw);height:auto;animation:bootPulse 1.8s ease-in-out infinite}
@keyframes bootPulse{0%,100%{opacity:.95;transform:scale(1)}50%{opacity:.55;transform:scale(.95)}}
@media (prefers-reduced-motion: reduce){#boot img{animation:none}}
</style>
</head>
<body>
<div id="boot"><img src="/turtleclient-wordmark.png" alt=""></div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
